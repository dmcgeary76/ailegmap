version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: k12_ai_db
    environment:
      POSTGRES_USER: ${DB_USER:-k12_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-k12_password}
      POSTGRES_DB: ${DB_NAME:-k12_ai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-k12_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: k12_ai_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-k12_user}:${DB_PASSWORD:-k12_password}@postgres:5432/${DB_NAME:-k12_ai_db}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - k12_network

  frontend:
    build: ./frontend
    container_name: k12_ai_frontend
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - k12_network

volumes:
  postgres_data:

networks:
  k12_network:
    driver: bridge
