# Optional. The app runs on a SQLite file, so there is no database service;
# `./start.sh` (or the two commands in the README) is the simpler path.
services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    env_file: ["./backend/.env"]
  frontend:
    build: ./frontend
    command: npm run dev
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
