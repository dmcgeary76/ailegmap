# Optional. Local development is `./start.sh`; this builds the two production
# shapes: the API with its SQLite file on a volume, and the static map on nginx.
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./backend/k12_ai.db:/app/k12_ai.db", "./backend/data:/app/data"]
    env_file: ["./backend/.env"]
  map:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:80"]
