# Publishes the static map to GitHub Pages on every push to main.
#
#   https://<user>.github.io/ailegmap/         the map (frontend static build + docs/data.json)
#   https://<user>.github.io/ailegmap/about/   the project page + changelog (docs/)
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy static map to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:static
        working-directory: frontend
      - name: Add the project page under /about/
        run: |
          mkdir -p frontend/dist/about
          cp -r docs/. frontend/dist/about/
          rm -f frontend/dist/about/data.json   # already at the root
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
